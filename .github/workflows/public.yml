name: Public checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test public checking tools
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Compile and launch Java
        run: python tools/run.py --setup
      - name: Check your algorithms and request-state reset
        run: python tools/run.py --check
      - name: Check own cases, witnesses, route helper and full limits
        run: python tests/run_own_tests.py --full
      - name: Validate benchmark forests and known optimum costs
        run: python tests/benchmark.py --validate-only
